appId: dev.leshy.desktop
productName: Leshy
directories:
  output: release
# 180 MB of ONNX weights do not belong in an archive, and a local build gains
# nothing from one. Keeps dist/ a plain directory inside the bundle.
asar: false
npmRebuild: false
files:
  - package.json
  - electron/out/**/*
  - dist/**/*
  - "!node_modules/**/*"
mac:
  category: public.app-category.developer-tools
  icon: assets/macos/compiled/Icon.icns
  extendInfo:
    CFBundleIconName: Icon
  extraResources:
    - from: assets/macos/compiled/Assets.car
      to: Assets.car
  target: [dmg]
linux:
  category: Development
  icon: assets/brand/leshy-app-icon-dark-1024.png
  # Electron takes the window's app_id / WM_CLASS from desktopName in
  # package.json. Syncing names the .desktop file and its StartupWMClass after
  # it too, so the desktop environment can link the window to the launcher.
  syncDesktopName: true
  target: [AppImage]
